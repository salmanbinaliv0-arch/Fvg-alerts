name: FVG alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs)
  workflow_dispatch:         # lets you run it manually

permissions:
  contents: write            # needed to save state.json

concurrency:
  group: fvg-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas numpy requests

      - name: Run FVG alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVAL: "15min"
          SYMBOL: "XAU/USD"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

        run: python fvg_alerts.py

      - name: Save state
        run: |
          git config user.name "fvg-bot"
          git config user.email "fvg-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
